name: CI

on:
  push:
    branches:
      - main
      - experiment/ab-evaluation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check source formatting
        run: npx --yes prettier@3.9.9 --check "src/**/*.{ts,html,css}" "public/i18n/*.json"

      - name: Run tests headlessly
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build
        run: npm run build
